[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kordena-fiscal-engine"
version = "0.1.0.dev0"
description = "Motor fiscal brasileiro modular e desacoplado para integração por contratos explícitos."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary-compatible public development; license TBD before release"}
authors = [{name = "FM Tecnologia"}]
dependencies = [
  "lxml>=5.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
