# Bling Worker: optional overlay, NEVER included by deploy.sh/cron/compose.prod.
# Install only after separately authorized schema v21, secret files and smoke.
# Requires compose.prod.yml to supply the canonical DB and networks.
services:
  nfcore-bling-worker:
    profiles: ["bling-worker-authorized"]
    build:
      context: ./src
      dockerfile: Dockerfile.worker
    image: nfcore-bling-worker:controlled
    container_name: nfcore-bling-worker
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    env_file:
      - path: .env.bling.worker
        required: true
    environment:
      NFCORE_ENVIRONMENT: production
      NFCORE_PERSISTENCE_BACKEND: postgres
      NFCORE_SECRET_BACKEND: external
      NFCORE_WORKER_CONNECTOR: bling-multi
      NFCORE_BLING_INSTALLATIONS_ENABLED: "true"
      DATABASE_URL: postgresql://nfcore:${POSTGRES_PASSWORD:?required}@nfcore-db:5432/nfcore
      NFCORE_BLING_CLIENT_SECRET_FILE: /run/nfcore/bling/client-secret
      NFCORE_BLING_TOKEN_MASTER_KEY_FILE: /run/nfcore/bling/master-key
    volumes:
      - type: bind
        source: ${NFCORE_BLING_SECRETS_HOST_DIR:?required}
        target: /run/nfcore/bling
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      nfcore-db:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-m", "kordena_fiscal.runtime.worker_health", "--check"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
    stop_grace_period: 90s
