# NFCore Contabo: compatibilidade opt-in do Worker com o Compose real do host.
# O host usa o servico `db` (container_name: nfcore-db) na rede nfcore_internal.
# Carregar somente apos o compose.worker.opt-in.yml e autorizacao humana.
# Nao renomeia nem recria o banco, e nao habilita o Worker por padrao.
services:
  nfcore-worker:
    depends_on: !override
      db:
        condition: service_healthy
