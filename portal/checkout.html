<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Contratar um plano · NFCore</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="runtime.css">
  <link rel="stylesheet" href="checkout.css">
  <script type="module" src="checkout.js"></script>
</head>
<body>
  <main class="login-view" aria-labelledby="checkout-title">
    <div class="login-card">
      <img class="brand-mark brand-mark--approved" src="assets/nfcore-emblem-approved.png" alt="">
      <p class="eyebrow">FM Tecnologia · NFCore</p>
      <h1 id="checkout-title">Contratar um plano</h1>
      <p>Escolha o plano e a cobrança desejada para seguir para o pagamento.</p>
      <p id="checkout-status" role="status" aria-live="polite">Consultando planos disponíveis…</p>
      <button id="checkout-reload" class="ghost" type="button" hidden>Consultar planos novamente</button>
      <form id="checkout-form" hidden>
        <fieldset id="checkout-fields">
          <label>Plano e cobrança<select id="checkout-price" required></select></label>
          <p id="checkout-offer" class="form-hint"></p>
          <label>Razão social<input id="checkout-name" name="organization" autocomplete="organization" maxlength="256" required></label>
          <label>E-mail para contato<input id="checkout-email" name="email" type="email" autocomplete="email" maxlength="320" required></label>
          <button class="primary" type="submit">Ir para o pagamento</button>
        </fieldset>
      </form>
      <p id="checkout-result" role="status" aria-live="polite"></p>
      <p><a href="trial.html">Prefere testar 14 dias grátis antes?</a></p>
      <p><a href="index.html">Já tenho uma conta / recuperar acesso</a></p>
      <noscript>Ative o JavaScript para consultar os planos e contratar.</noscript>
    </div>
  </main>
</body>
</html>
