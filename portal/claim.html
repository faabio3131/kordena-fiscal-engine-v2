<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Confirmar compra · NFCore</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="runtime.css">
  <link rel="stylesheet" href="claim.css">
  <script type="module" src="claim.js"></script>
</head>
<body>
  <main class="login-view" aria-labelledby="claim-title">
    <div class="login-card">
      <img class="brand-mark brand-mark--approved" src="assets/nfcore-emblem-approved.png" alt="">
      <p class="eyebrow">FM Tecnologia · NFCore</p>
      <h1 id="claim-title">Confirme sua compra</h1>
      <p id="claim-intro">Informe a razão social/nome jurídico para concluir a ativação da sua conta.</p>
      <p id="claim-status" role="status" aria-live="polite">Verificando link de confirmação…</p>
      <form id="claim-form" hidden>
        <fieldset id="claim-fields">
          <label>Razão social / nome jurídico<input id="claim-legal-name" name="legal_name" autocomplete="organization" maxlength="256" required></label>
          <button class="primary" type="submit">Confirmar compra</button>
        </fieldset>
      </form>
      <p id="claim-result" role="status" aria-live="polite"></p>
      <p><a href="index.html">Já tenho uma conta / recuperar acesso</a></p>
      <noscript>Ative o JavaScript para confirmar sua compra.</noscript>
    </div>
  </main>
</body>
</html>
