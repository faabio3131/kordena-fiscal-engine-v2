name: WP08 pytest diagnostic

on:
  push:
    branches:
      - feat/nfcore-web-08-observability-recovery

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Pytest diagnostic
        id: pytest
        continue-on-error: true
        shell: bash
        run: pytest -vv > pytest-diagnostic.log 2>&1
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: wp08-pytest-diagnostic
          path: pytest-diagnostic.log
          retention-days: 1
      - name: Enforce diagnostic result
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: test "$PYTEST_OUTCOME" = "success"
