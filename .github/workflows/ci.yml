name: FM Fiscal Core V2 CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2/homologation-controlled-pilots

      - name: Apply V2-15 compatibility formatting once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/control_plane/test_v2_12_closure.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    vault = _vault(certificate, credentials, nfse_credentials, csc, "
              "pkcs12_bytes=_synthetic_pkcs12())\n"
          )
          new = (
              "    vault = _vault(\n"
              "        certificate,\n"
              "        credentials,\n"
              "        nfse_credentials,\n"
              "        csc,\n"
              "        pkcs12_bytes=_synthetic_pkcs12(),\n"
              "    )\n"
          )
          updated = text.replace(old, new)
          if updated != text:
              path.write_text(updated, encoding="utf-8")
          PY

          git diff --check
          if ! git diff --quiet -- tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests
            git commit -m "test(v2-15): format provider-scoped closure fixtures"
            git push origin HEAD:v2/homologation-controlled-pilots
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
