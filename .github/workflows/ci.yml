name: FM Fiscal Core V2 CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2/homologation-controlled-pilots

      - name: Split runtime adapters from control plane
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/kordena_fiscal/control_plane/commercial_runtime.py")
          source = source_path.read_text(encoding="utf-8")
          marker = "\n\nclass CommercialRuntimeConfigurationService:"
          if marker not in source:
              raise SystemExit("commercial runtime split marker not found")
          runtime_part, admin_part = source.split(marker, 1)

          runtime_part = runtime_part.replace(
              "from .commercial import ProviderBindingResolver, ProviderRuntimePolicyConfig\n",
              "from kordena_fiscal.control_plane.commercial import (\n"
              "    ProviderBindingResolver,\n"
              "    ProviderRuntimePolicyConfig,\n"
              ")\n",
          )
          runtime_part = runtime_part.replace(
              "from .commercial_models import HomologationEvidenceRecord, NumberingConfiguration\n",
              "from kordena_fiscal.control_plane.commercial_models import (\n"
              "    HomologationEvidenceRecord,\n"
              "    NumberingConfiguration,\n"
              ")\n",
          )
          runtime_part = runtime_part.replace(
              "from .models import AdminPrincipal, ControlPlanePermission\n",
              "",
          )
          runtime_part = runtime_part.replace(
              "from .service import (\n"
              "    ControlPlaneAuthorizationError,\n"
              "    ControlPlaneNotFoundError,\n"
              ")\n",
              "from kordena_fiscal.control_plane.service import ControlPlaneNotFoundError\n",
          )

          runtime_dir = Path("src/kordena_fiscal/runtime")
          runtime_dir.mkdir(parents=True, exist_ok=True)
          (runtime_dir / "commercial.py").write_text(
              runtime_part + "\n",
              encoding="utf-8",
          )
          (runtime_dir / "__init__.py").write_text(
              '"""Runtime composition for durable customer configuration."""\n',
              encoding="utf-8",
          )

          admin_header = '''"""Governed writes for durable commercial runtime configuration."""

          from __future__ import annotations

          from kordena_fiscal.control_plane.commercial_models import (
              HomologationEvidenceRecord,
              NumberingConfiguration,
          )
          from kordena_fiscal.domain import FiscalEnvironment, FiscalValidationError
          from kordena_fiscal.persistence.ports import FiscalUnitOfWorkFactory
          from kordena_fiscal.security import WorkloadCredentialRecord

          from .models import AdminPrincipal, ControlPlanePermission
          from .service import (
              ControlPlaneAuthorizationError,
              ControlPlaneNotFoundError,
          )
          '''
          admin_header = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in admin_header.splitlines()
          )
          admin_source = (
              admin_header
              + "\n\nclass CommercialRuntimeConfigurationService:"
              + admin_part
              + "\n"
          )
          Path("src/kordena_fiscal/control_plane/commercial_admin.py").write_text(
              admin_source,
              encoding="utf-8",
          )
          source_path.unlink()

          test_path = Path("tests/control_plane/test_v2_15_commercial_runtime.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_import = '''from kordena_fiscal.control_plane.commercial_runtime import (
              CommercialRuntimeConfigurationService,
              DurableConfiguredSequenceManager,
              DurableFiscalBindingResolver,
              DurableHomologationEvidenceResolver,
              DurableNumberingConfigurationResolver,
              DurablePolicyResilientProviderGateway,
              DurableProviderRuntimePolicyResolver,
              DurableWorkloadAuthenticator,
              PolicyBoundFiscalProviderTransport,
          )'''
          old_import = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_import.splitlines()
          )
          new_import = '''from kordena_fiscal.control_plane.commercial_admin import (
              CommercialRuntimeConfigurationService,
          )
          from kordena_fiscal.runtime.commercial import (
              DurableConfiguredSequenceManager,
              DurableFiscalBindingResolver,
              DurableHomologationEvidenceResolver,
              DurableNumberingConfigurationResolver,
              DurablePolicyResilientProviderGateway,
              DurableProviderRuntimePolicyResolver,
              DurableWorkloadAuthenticator,
              PolicyBoundFiscalProviderTransport,
          )'''
          new_import = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_import.splitlines()
          )
          if old_import not in test_text:
              raise SystemExit("runtime test import marker not found")
          test_path.write_text(
              test_text.replace(old_import, new_import, 1),
              encoding="utf-8",
          )

          migration_path = Path("tests/control_plane/test_durable_persistence.py")
          migration_text = migration_path.read_text(encoding="utf-8")
          old_tables = '''    for table in (
              "fm_commercial_provider_runtime_policies",
              "fm_commercial_webhook_destinations",
              "fm_commercial_unit_modules",
              "fm_commercial_product_profiles",
              "fm_commercial_provider_bindings",
          ):'''
          old_tables = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_tables.splitlines()
          )
          new_tables = '''    for table in (
              "fm_commercial_homologation_evidence",
              "fm_commercial_workload_credentials",
              "fm_commercial_numbering_configurations",
              "fm_commercial_provider_runtime_policies",
              "fm_commercial_webhook_destinations",
              "fm_commercial_unit_modules",
              "fm_commercial_product_profiles",
              "fm_commercial_provider_bindings",
          ):'''
          new_tables = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_tables.splitlines()
          )
          if old_tables not in migration_text:
              raise SystemExit("V5 rollback table marker not found")
          migration_path.write_text(
              migration_text.replace(old_tables, new_tables, 1),
              encoding="utf-8",
          )
          PY

          python -m pip install ruff==0.16.7
          ruff check src tests --fix
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "refactor(v2-15): keep provider runtime outside control plane"
          git push origin HEAD:v2/homologation-controlled-pilots

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
