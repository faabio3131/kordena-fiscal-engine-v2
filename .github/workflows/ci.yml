name: FM NFCORE V1 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/nfcore-web-08-observability-recovery

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install --no-audit --no-fund

      - name: Frontend lint
        run: npm run lint:frontend

      - name: Frontend typecheck
        run: npm run typecheck:frontend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build:frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E critical
        run: npm run test:e2e

      - name: Validate compose
        run: docker compose config --quiet

      - name: Validate recovery scripts
        run: |
          sh -n scripts/postgres_backup.sh
          sh -n scripts/postgres_restore.sh

      - name: Build runtime images
        run: |
          docker build -f Dockerfile.api -t nfcore-api:test .
          docker build -f Dockerfile.worker -t nfcore-worker:test .
          docker build -f Dockerfile.portal -t nfcore-portal:test .

      - name: Validate non-root images
        run: |
          test "$(docker image inspect nfcore-api:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect nfcore-worker:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect nfcore-portal:test --format '{{.Config.User}}')" = "10001:10001"

      - name: Reject insecure production profile
        run: |
          if docker run --rm \
            -e NFCORE_ENVIRONMENT=production \
            -e NFCORE_PERSISTENCE_BACKEND=sqlite \
            -e NFCORE_SECRET_BACKEND=memory \
            -e NFCORE_REQUIRE_HTTPS=false \
            nfcore-api:test; then
            echo "insecure production profile unexpectedly started"
            exit 1
          fi

      - name: API container smoke and readiness
        run: |
          docker run -d --name nfcore-api-smoke --network host \
            -e NFCORE_ENVIRONMENT=staging \
            -e NFCORE_PERSISTENCE_BACKEND=postgres \
            -e DATABASE_URL="$NFCORE_TEST_POSTGRES_DSN" \
            -e NFCORE_SECRET_BACKEND=external \
            -e NFCORE_REQUIRE_HTTPS=true \
            nfcore-api:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health/live
          curl --fail http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/internal/metrics >/tmp/nfcore-metrics.json
          ! grep -Eqi 'password|authorization|private key|begin certificate|csc=' /tmp/nfcore-metrics.json
          test "$(docker inspect nfcore-api-smoke --format '{{.State.Running}}')" = "true"
          docker stop --time 10 nfcore-api-smoke
          docker rm nfcore-api-smoke

      - name: Worker container startup and governed exit
        run: |
          docker run --rm --network host \
            -e NFCORE_ENVIRONMENT=staging \
            -e NFCORE_PERSISTENCE_BACKEND=postgres \
            -e DATABASE_URL="$NFCORE_TEST_POSTGRES_DSN" \
            -e NFCORE_SECRET_BACKEND=external \
            -e NFCORE_REQUIRE_HTTPS=true \
            -e NFCORE_WORKER_ONESHOT=true \
            nfcore-worker:test

      - name: Portal container smoke
        run: |
          docker run -d --name nfcore-portal-smoke --network host nfcore-portal:test
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8081/ >/dev/null
          docker stop --time 10 nfcore-portal-smoke
          docker rm nfcore-portal-smoke

      - name: Inspect images for forbidden secret artifacts
        run: |
          for image in nfcore-api:test nfcore-worker:test nfcore-portal:test; do
            docker history --no-trunc "$image" | grep -Evi 'PASSWORD=|PRIVATE KEY|BEGIN CERTIFICATE|CSC=' >/dev/null
          done

      - name: PostgreSQL backup and restore rehearsal
        run: |
          mkdir -p .tmp-backup
          docker run --rm --network host \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            psql -h 127.0.0.1 -U nfcore -d nfcore_test -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS wp08_restore_sentinel (id integer PRIMARY KEY, value text NOT NULL);" \
            -c "INSERT INTO wp08_restore_sentinel (id,value) VALUES (1,'restore-ok') ON CONFLICT (id) DO UPDATE SET value=EXCLUDED.value;"
          docker run --rm --network host \
            -v "$PWD/.tmp-backup:/backup" \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U nfcore -d nfcore_test -Fc -f /backup/nfcore.dump
          sha256sum .tmp-backup/nfcore.dump > .tmp-backup/nfcore.dump.sha256
          sha256sum --check .tmp-backup/nfcore.dump.sha256
          docker run --rm --network host \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            psql -h 127.0.0.1 -U nfcore -d nfcore_test -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          docker run --rm --network host \
            -v "$PWD/.tmp-backup:/backup" \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U nfcore -d nfcore_test \
            --no-owner --no-acl --exit-on-error /backup/nfcore.dump
          test "$(docker run --rm --network host -e PGPASSWORD=nfcore_test_password postgres:16-alpine psql -h 127.0.0.1 -U nfcore -d nfcore_test -Atqc "SELECT value FROM wp08_restore_sentinel WHERE id=1")" = "restore-ok"

      - name: Application readiness against restored database
        env:
          NFCORE_ENVIRONMENT: staging
          NFCORE_PERSISTENCE_BACKEND: postgres
          DATABASE_URL: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
          NFCORE_SECRET_BACKEND: external
          NFCORE_REQUIRE_HTTPS: "true"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from kordena_fiscal.runtime.api import create_runtime_app

          with TestClient(create_runtime_app()) as client:
              response = client.get('/health/ready')
              assert response.status_code == 200, response.text
          PY
