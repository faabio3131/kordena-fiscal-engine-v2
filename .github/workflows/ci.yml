name: FM NFCORE V1 CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install --no-audit --no-fund

      - name: Frontend lint
        run: npm run lint:frontend

      - name: Frontend typecheck
        run: npm run typecheck:frontend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build:frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E critical
        run: npm run test:e2e
