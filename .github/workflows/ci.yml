name: FM Fiscal Core V2 CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2/homologation-controlled-pilots

      - name: Apply V2-15 compatibility patch once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("tests").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              updated = text.replace(
                  "assert database.initialize() == (1, 2, 3, 4)",
                  "assert database.initialize() == (1, 2, 3, 4, 5)",
              ).replace(
                  "assert database.applied_migrations() == (1, 2, 3, 4)",
                  "assert database.applied_migrations() == (1, 2, 3, 4, 5)",
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          path = Path("tests/control_plane/test_durable_persistence.py")
          text = path.read_text(encoding="utf-8")
          marker = "\ndef _remove_v4(connection: sqlite3.Connection) -> None:\n"
          helper = """
          \ndef _remove_v5(connection: sqlite3.Connection) -> None:
              for table in (
                  "fm_commercial_provider_runtime_policies",
                  "fm_commercial_webhook_destinations",
                  "fm_commercial_unit_modules",
                  "fm_commercial_product_profiles",
                  "fm_commercial_provider_bindings",
              ):
                  connection.execute(f"DROP TABLE {table}")
              connection.execute("DELETE FROM fm_schema_migrations WHERE version = 5")
          """
          if "def _remove_v5" not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace(
              "with sqlite3.connect(database.path) as connection:\n        _remove_v4(connection)",
              "with sqlite3.connect(database.path) as connection:\n        _remove_v5(connection)\n        _remove_v4(connection)",
          )
          text = text.replace(
              "assert database.initialize() == (4,)",
              "assert database.initialize() == (4, 5)",
          )
          text = text.replace(
              'assert columns == {"reference_id", "kind", "tenant_id", "unit_id", "environment"}',
              'assert columns == {\n        "reference_id",\n        "kind",\n        "tenant_id",\n        "unit_id",\n        "environment",\n        "provider_id",\n    }',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/control_plane/test_v2_11_end_to_end.py")
          text = path.read_text(encoding="utf-8")
          denied = '''reference_id="ref:fm-fiscal/tenant-a/unit-01/denied",
                      kind=SecretReferenceKind.CREDENTIALS,
                      tenant_id="tenant-a",
                      unit_id="unit-01",
                      environment=FiscalEnvironment.HOMOLOGATION,
                  )'''
          denied_scoped = '''reference_id="ref:fm-fiscal/tenant-a/unit-01/denied",
                      kind=SecretReferenceKind.CREDENTIALS,
                      tenant_id="tenant-a",
                      unit_id="unit-01",
                      environment=FiscalEnvironment.HOMOLOGATION,
                      provider_id="provider-denied",
                  )'''
          text = text.replace(denied, denied_scoped)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/control_plane/test_v2_12_closure.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'CREDENTIAL_REF = "ref:fm-fiscal/tenant-closure/unit-closure/hml-provider-credentials"',
              'CREDENTIAL_REF = "ref:fm-fiscal/tenant-closure/unit-closure/hml-provider-credentials"\nNFSE_CREDENTIAL_REF = (\n    "ref:fm-fiscal/tenant-closure/unit-closure/hml-nfse-provider-credentials"\n)',
          )
          text = text.replace(
              ") -> tuple[SecretReference, SecretReference, SecretReference]:",
              ") -> tuple[SecretReference, SecretReference, SecretReference, SecretReference]:",
              1,
          )
          text = text.replace(
              '''    credentials = SecretReference(
                  reference_id=CREDENTIAL_REF,
                  kind=SecretReferenceKind.CREDENTIALS,
                  tenant_id=TENANT,
                  unit_id=UNIT,
                  environment=FiscalEnvironment.HOMOLOGATION,
              )
              csc = SecretReference(''',
              '''    credentials = SecretReference(
                  reference_id=CREDENTIAL_REF,
                  kind=SecretReferenceKind.CREDENTIALS,
                  tenant_id=TENANT,
                  unit_id=UNIT,
                  environment=FiscalEnvironment.HOMOLOGATION,
                  provider_id=PROVIDER,
              )
              nfse_credentials = SecretReference(
                  reference_id=NFSE_CREDENTIAL_REF,
                  kind=SecretReferenceKind.CREDENTIALS,
                  tenant_id=TENANT,
                  unit_id=UNIT,
                  environment=FiscalEnvironment.HOMOLOGATION,
                  provider_id=NFSE_PROVIDER,
              )
              csc = SecretReference(''',
          )
          text = text.replace(
              '''        environment=FiscalEnvironment.HOMOLOGATION,
              )
              for reference in (certificate, credentials, csc):''',
              '''        environment=FiscalEnvironment.HOMOLOGATION,
                  provider_id=PROVIDER,
              )
              for reference in (certificate, credentials, nfse_credentials, csc):''',
              1,
          )
          text = text.replace(
              "    return certificate, credentials, csc",
              "    return certificate, credentials, nfse_credentials, csc",
              1,
          )
          text = text.replace(
              '''def _vault(
              certificate: SecretReference,
              credentials: SecretReference,
              csc: SecretReference,''',
              '''def _vault(
              certificate: SecretReference,
              credentials: SecretReference,
              nfse_credentials: SecretReference,
              csc: SecretReference,''',
          )
          text = text.replace(
              '''        reference=credentials,
                  material=EphemeralProviderCredentialsMaterial(
                      reference_id=CREDENTIAL_REF,
                      credential_bytes=NFSE_CREDENTIAL_BYTES,
                  ),
                  provider_id=NFSE_PROVIDER,''',
              '''        reference=nfse_credentials,
                  material=EphemeralProviderCredentialsMaterial(
                      reference_id=NFSE_CREDENTIAL_REF,
                      credential_bytes=NFSE_CREDENTIAL_BYTES,
                  ),
                  provider_id=NFSE_PROVIDER,''',
          )
          text = text.replace(
              "certificate, credentials, csc = _onboard(database)",
              "certificate, credentials, nfse_credentials, csc = _onboard(database)",
          )
          text = text.replace(
              "_vault(certificate, credentials, csc,",
              "_vault(certificate, credentials, nfse_credentials, csc,",
          )
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          if ! git diff --quiet -- tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests
            git commit -m "test(v2-15): align regressions with commercial configuration V5"
            git push origin HEAD:v2/homologation-controlled-pilots
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
