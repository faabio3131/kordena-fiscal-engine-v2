name: FM Fiscal Core V2 CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2/homologation-controlled-pilots

      - name: Apply B0 runtime patch
        run: python scripts/v2_15_b0_runtime_patch.py

      - name: Commit B0 runtime patch
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "feat(v2-15): wire durable B0 commercial runtime"
            git push origin HEAD:v2/homologation-controlled-pilots
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
