name: FM NFCORE V1 Production Promotion

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Immutable commit/release revision already certified for promotion"
        required: true
        type: string
      approval:
        description: "Type PRODUCTION_APPROVED to authorize the production promotion"
        required: true
        type: string

concurrency:
  group: nfcore-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize production promotion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require explicit human approval token
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "PRODUCTION_APPROVED"

  promote:
    name: Promote production
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      NFCORE_ENVIRONMENT: production
      NFCORE_PERSISTENCE_BACKEND: postgres
      NFCORE_SECRET_BACKEND: external
      NFCORE_REQUIRE_HTTPS: "true"
      NFCORE_PRODUCTION_APPROVAL: PRODUCTION_APPROVED
      NFCORE_PRODUCTION_BASE_URL: ${{ vars.NFCORE_PRODUCTION_BASE_URL }}
      NFCORE_PRODUCTION_DEPLOY_DRIVER: ${{ vars.NFCORE_PRODUCTION_DEPLOY_DRIVER }}
      DATABASE_URL: ${{ secrets.NFCORE_PRODUCTION_DATABASE_URL }}
      NFCORE_DEPLOY_REVISION: ${{ inputs.source_revision }}
    steps:
      - name: Checkout the exact certified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -e ".[dev]"
      - name: Govern migration policy
        run: python scripts/ci/migration_guard.py --check-policy
      - name: Fail-closed preflight, migrate, deploy, smoke and rollback on failure
        run: sh scripts/ci/run_production_promotion.sh
      - name: Write safe promotion evidence
        if: success()
        run: |
          mkdir -p .artifacts
          {
            echo "state=PRODUCTION_PROMOTED"
            echo "revision=${NFCORE_DEPLOY_REVISION}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > .artifacts/production-promotion-evidence.txt
      - name: Upload safe evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nfcore-production-promotion-evidence
          path: .artifacts/production-promotion-evidence.txt
          retention-days: 30
