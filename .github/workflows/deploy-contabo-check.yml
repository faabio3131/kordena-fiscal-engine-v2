name: Deploy Contabo (config e teste)

on:
  pull_request:
    paths: ["deploy/contabo/**", ".github/workflows/deploy-contabo-check.yml", ".github/workflows/contabo-readonly-host-audit.yml", ".github/workflows/contabo-gsm-readonly-host-audit.yml"]
  push:
    branches: [main]
    paths: ["deploy/contabo/**"]

permissions:
  contents: read

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck dos scripts de deploy
        run: shellcheck -S warning deploy/contabo/*.sh
      - name: Teste do deploy.sh (docker simulado)
        run: bash deploy/contabo/test-deploy.sh
      - name: Validar compose de produção
        run: |
          printf 'POSTGRES_PASSWORD=x\n' > deploy/contabo/.env   # só no runner; o .env real nunca é versionado
          docker compose -f deploy/contabo/compose.prod.yml config -q
      - name: Testar overlay opt-in do Worker sem iniciá-lo
        run: |
          bash deploy/contabo/test-worker-opt-in.sh
          bash deploy/contabo/test-bling-api-opt-in.sh
      - name: Auditar preflight Bling sem host/segredos
        run: bash deploy/contabo/test-bling-operational-host-audit.sh
      - name: Validar comando SSH restrito sem host/segredos
        run: bash deploy/contabo/test-host-audit-command.sh
      - name: Validar chain of trust e privilegio Docker restrito
        run: bash deploy/contabo/test-root-host-audit.sh
      - name: Validar sintaxe da politica sudoers de exemplo
        run: sudo visudo -cf deploy/contabo/nfcore-audit.sudoers.example
