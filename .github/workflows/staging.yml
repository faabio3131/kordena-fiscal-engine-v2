name: FM NFCORE V1 Staging

on:
  workflow_dispatch:
    inputs:
      execute_deploy:
        description: "Execute a real staging deploy (requires provisioned external inputs)"
        required: true
        type: boolean
        default: false

concurrency:
  group: nfcore-staging
  cancel-in-progress: false

jobs:
  contract:
    name: Staging contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Govern migration policy
        run: python scripts/ci/migration_guard.py --check-policy
      - name: Validate staging scripts
        run: |
          sh -n scripts/ci/staging_preflight.sh
          sh -n scripts/ci/staging_smoke.sh
          sh -n scripts/ci/run_staging_deploy.sh
      - name: Record non-provisioned state
        if: ${{ !inputs.execute_deploy }}
        run: |
          echo "### Staging state: BLOCKED_EXTERNAL" >> "$GITHUB_STEP_SUMMARY"
          echo "Internal deployment contract is valid; no real infrastructure was requested." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy staging
    if: ${{ inputs.execute_deploy }}
    needs: contract
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      NFCORE_ENVIRONMENT: staging
      NFCORE_PERSISTENCE_BACKEND: postgres
      NFCORE_SECRET_BACKEND: external
      NFCORE_REQUIRE_HTTPS: "true"
      NFCORE_STAGING_BASE_URL: ${{ vars.NFCORE_STAGING_BASE_URL }}
      NFCORE_STAGING_DEPLOY_DRIVER: ${{ vars.NFCORE_STAGING_DEPLOY_DRIVER }}
      DATABASE_URL: ${{ secrets.NFCORE_STAGING_DATABASE_URL }}
      NFCORE_DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Fail-closed preflight, migrate, deploy and smoke
        run: sh scripts/ci/run_staging_deploy.sh
      - name: Write safe deployment evidence
        if: success()
        run: |
          mkdir -p .artifacts
          {
            echo "state=STAGING_DEPLOYED"
            echo "revision=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > .artifacts/staging-deployment-evidence.txt
      - name: Upload safe evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nfcore-staging-deployment-evidence
          path: .artifacts/staging-deployment-evidence.txt
          retention-days: 14
