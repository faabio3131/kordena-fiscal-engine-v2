name: Osasco public WCF contract (read-only)

on:
  push:
    branches:
      - feat/nfcore-osasco-official-fetch-20261113
    paths:
      - scripts/ci/osasco_public_wsdl_audit.py
      - .github/workflows/osasco-official-wsdl.yml

permissions:
  contents: write

jobs:
  download-official-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XML parser
        run: python -m pip install 'lxml>=5,<7'
      - name: Fetch and verify official public WSDL and inline XSDs (GET only)
        run: python scripts/ci/osasco_public_wsdl_audit.py
      - name: Save raw public evidence on THIS ISOLATED BRANCH ONLY
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nfcore-osasco-contract-audit[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/official/osasco/homologation
          if git diff --cached --quiet; then
            echo 'Official contract evidence unchanged'
          else
            git commit -m 'test(osasco): pin public municipal WSDL and inline XSD evidence'
            git push origin 'HEAD:feat/nfcore-osasco-official-fetch-20261113'
          fi
